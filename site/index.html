<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת עסקאות נדל"ן</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --ink: #1d1d1b; --ink2: #5f5e5a; --ink3: #8a8983; --line: #e4e3df; --accent: #2a78d6;
    --warn: #b45309; --chip: #f1f0ec; --bar: #2a78d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
           box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  #legend { top: 12px; left: 12px; padding: 10px 12px; }
  #legend h1 { font-size: 14px; margin: 0 0 6px; }
  #legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); }
  #legend .sw { width: 22px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; }
  #open-stats { top: 12px; right: 12px; padding: 8px 14px; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; }
  body.has-panel #open-stats { display: none; }

  #side { top: 12px; right: 12px; bottom: 12px; width: min(480px, calc(100vw - 24px)); display: none; flex-direction: column; overflow: hidden; }
  #side.open { display: flex; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 10px; gap: 4px; }
  .tabs button { border: 0; background: none; font: inherit; padding: 10px 10px 8px; color: var(--ink2); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tabs button:disabled { color: var(--ink3); cursor: default; }
  #close { margin-inline-start: auto; font-size: 22px; line-height: 1; }
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* details tab */
  #detail header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #detail h2 { margin: 0 0 4px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink2); }
  .chip.warn { color: var(--warn); }
  .note { font-size: 12px; color: var(--ink2); margin: 6px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  button.link { border: 1px solid var(--line); background: var(--bg); color: var(--accent); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #deals { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--bg); color: var(--ink2); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.suspect td { color: var(--ink2); }
  .tag { font-size: 11px; color: var(--warn); }
  .more { padding: 10px; text-align: center; }
  .empty { padding: 20px; color: var(--ink2); }

  /* stats tab */
  #stats { overflow: auto; padding: 12px 14px 16px; }
  #stats .scope { font-size: 12px; color: var(--ink2); margin: 0 0 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tile .label { font-size: 12px; color: var(--ink2); }
  .tile .value { font-size: 20px; font-weight: 600; }
  .tile .sub { font-size: 11px; color: var(--ink3); }
  #stats h3 { font-size: 13px; margin: 16px 0 2px; }
  #stats .cap { font-size: 11px; color: var(--ink3); margin: 0 0 4px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; direction: ltr; overflow: visible; }
  .chart text { font-size: 10px; fill: var(--ink3); font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .grid-tip .maplibregl-popup-content { padding: 6px 10px; font-size: 12px; direction: rtl; text-align: right; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px;
         border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
  .hbar { display: grid; grid-template-columns: 9em 1fr 4.5em; gap: 6px; align-items: center; font-size: 12px; margin: 3px 0; }
  .hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .hbar .track { height: 10px; }
  .hbar .fill { height: 10px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .val { font-variant-numeric: tabular-nums; color: var(--ink2); }
  #stats table { font-size: 12px; }
  tr.pick { cursor: pointer; } tr.pick:hover { background: var(--chip); }

  #search { top: 12px; left: 320px; right: 220px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; max-height: min(70vh, 560px); overflow: auto; }
  body.has-panel #search { right: calc(min(480px, 100vw - 24px) + 24px); }
  #search-form { display: flex; gap: 6px; }
  #search-q { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; background: var(--bg); color: var(--ink); }
  #search-form button, #search-examples .example, #search-out .rank { border: 1px solid var(--line); background: var(--bg); color: var(--accent); border-radius: 8px; padding: 7px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  #search-clear { color: var(--ink2); font-weight: 500; }
  #search-status, .search-note { margin: 0; font-size: 12px; color: var(--ink2); }
  .search-warn { margin: 0; font-size: 12px; color: var(--warn); }
  #search-examples { display: flex; flex-wrap: wrap; gap: 4px; }
  #search-examples .example, #search-out .rank { font-weight: 400; text-align: right; color: var(--ink); background: var(--chip); }
  #search-out { overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  #search-out .chips { margin: 0; }
  #search-out:empty, #search-examples:empty { display: none; }

  @media (max-width: 960px) {
    #search, body.has-panel #search { left: 8px; top: 8px; max-height: 140px; }
    #search { right: 8px; }
    #legend { top: 156px; }
    body.has-panel #legend { display: none; }
  }
  @media (max-width: 640px) {
    #side { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; }
    #legend { top: 8px; left: 8px; padding: 6px 8px; }
    #legend .row { font-size: 11px; }
    #open-stats { top: 8px; right: 8px; }
    #search { top: 52px; left: 8px; right: 8px; max-height: 220px; }
    body.has-panel #search { right: 8px; max-height: 148px; }
    body.has-panel #legend { display: none; }
    th, td { padding: 5px 4px; font-size: 12px; }
    .tag { white-space: normal; max-width: 120px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="legend" class="panel">
  <h1 id="legend-title"></h1>
  <div id="legend-rows"></div>
  <div class="row" style="margin-top:6px"><span class="sw" style="background:#b8b6ae"></span>אין נתוני מחיר מהימנים</div>
  <div class="row" id="lg-zoomed-out">כל ריבוע: חציון האזור. התקרבו כדי לראות בניינים</div>
  <div class="row lg-zoomed-in"><span class="dot" style="background:#e34948;border:1.5px solid #fff"></span>חלקה ללא בניין במפה</div>
  <div class="row lg-zoomed-in"><span class="dot" style="background:#fff;border:2.5px solid #4a3aa7"></span>מיקום לפי גוש בלבד</div>
</div>

<div id="search" class="panel">
  <form id="search-form" role="search">
    <input id="search-q" type="search" autocomplete="off" enterkeyhint="search"
      placeholder="דירות, יישוב, חדרים, מחיר למ&quot;ר, שנה…"
      aria-label="חיפוש חופשי בעסקאות">
    <button type="submit">חיפוש</button>
    <button type="button" id="search-clear" hidden>ניקוי</button>
  </form>
  <p id="search-status" class="search-status"></p>
  <div id="search-examples"></div>
  <div id="search-out"></div>
</div>

<button id="open-stats" class="panel">סטטיסטיקה לאזור המוצג</button>

<aside id="side" class="panel" aria-live="polite">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-detail" aria-selected="false" disabled>עסקאות</button>
    <button role="tab" id="tab-stats" aria-selected="false">סטטיסטיקה לאזור המוצג</button>
    <button id="close" aria-label="סגור">×</button>
  </div>
  <section class="view" id="detail">
    <header>
      <h2 id="title"></h2>
      <div class="chips" id="chips"></div>
      <p class="note" id="note"></p>
      <div class="actions"><button class="link" id="toggle-block"></button></div>
    </header>
    <div id="deals"></div>
  </section>
  <section class="view" id="stats"></section>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Map labels in Hebrew need the RTL shaping plugin, otherwise MapLibre draws them reversed.
maplibregl.setRTLTextPlugin("https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js", true);

const COLORS = ["#fde8c8", "#fbc88c", "#f59b5e", "#e8683f", "#c4402f", "#8b1e2d", "#5e0f20"];
const NO_DATA = "#b8b6ae";
const DETAIL_ZOOM = 14;                 // from here on the map loads grid cells (buildings) instead of the price squares
const MAX_CELLS = 120;                  // keep at most this many downloaded cells in memory (per kind)
const fmt = new Intl.NumberFormat("he-IL");
const compact = new Intl.NumberFormat("he-IL", { notation: "compact", maximumFractionDigits: 1 });
const money = v => v == null ? "—" : "₪" + fmt.format(Math.round(v));
const moneyC = v => v == null ? "—" : "₪" + compact.format(v);
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const k = v => v >= 1000 ? Math.round(v / 1000) + "K" : String(v);

let META, SETTLEMENTS, APT_TYPES, APT_IDX;
let activeQuery = null;   // validated search filters; null means the map is unfiltered
let streetNeedle = "";     // official street name to highlight, empty if the query has no resolved street
let viewHook = null;
let resolveReady = () => {};
const readyPromise = new Promise(res => { resolveReady = res; });
// Two kinds of per-cell files: "cells" (buildings and points, drawn) and "stats" (deal summaries, stats tab only)
const store = { cells: { data: new Map(), pending: new Map(), keys: null },
                stats: { data: new Map(), pending: new Map(), keys: null } };
let shownKey = "";                      // which cells the map sources currently hold

const map = new maplibregl.Map({
  container: "map", style: "https://tiles.openfreemap.org/styles/liberty",
  center: [34.95, 31.75], zoom: 7.6, minZoom: 6, hash: true,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-left");
map.addControl(new maplibregl.GeolocateControl({}), "bottom-left");

const empty = { type: "FeatureCollection", features: [] };

map.on("load", async () => {
  // the basemap's 3D buildings are costly to draw in dense cities and sit under our own buildings
  if (map.getLayer("building-3d")) map.removeLayer("building-3d");
  [META, SETTLEMENTS] = await Promise.all(["data/meta.json", "data/settlements.json"].map(u => fetch(u).then(r => r.json())));
  APT_TYPES = new Set(META.apt_types);
  APT_IDX = new Set(META.types.map((t, i) => APT_TYPES.has(t) ? i : -1).filter(i => i >= 0));
  store.cells.keys = new Set(META.cells);
  store.stats.keys = new Set(META.stat_cells);
  resolveReady();

  const th = META.thresholds, cols = COLORS.slice(0, th.length + 1);
  const labels = cols.map((_, i) => i === 0 ? `עד ${k(th[0])}` : i === th.length ? `מעל ${k(th[i - 1])}` : `${k(th[i - 1])}–${k(th[i])}`);
  document.getElementById("legend-title").textContent = `מחיר למ"ר, דירות שנמכרו מ-${META.color_from} (חציון)`;
  document.getElementById("legend-rows").innerHTML =
    labels.map((l, i) => `<div class="row"><span class="sw" style="background:${cols[i]}"></span>${l}</div>`).join("");
  const colorExpr = ["case", ["==", ["get", "ppsqm"], null], NO_DATA,
    ["step", ["get", "ppsqm"], cols[0], ...th.flatMap((v, i) => [v, cols[i + 1]])]];

  map.addSource("grid", { type: "geojson", data: "data/grid.geojson", maxzoom: 12 });
  // maxzoom 15: tiles are cut up to z15 and overzoomed beyond, far less work per update than the default 18
  map.addSource("buildings", { type: "geojson", data: empty, promoteId: "id", maxzoom: 15 });
  map.addSource("points", { type: "geojson", data: empty, maxzoom: 15 });

  // Zoomed out: price squares, coarser when further out. Drawn under the basemap labels so place names stay readable.
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  const gridZooms = { 1000: [0, 10], 500: [10, 12], 250: [12, DETAIL_ZOOM] };
  for (const m of META.grid_m) map.addLayer({ id: `grid-${m}`, type: "fill", source: "grid", filter: ["==", ["get", "m"], m],
    minzoom: gridZooms[m][0], maxzoom: gridZooms[m][1],
    paint: { "fill-color": colorExpr, "fill-opacity": 0.78, "fill-outline-color": "rgba(255,255,255,0.25)" } }, firstLabel);
  map.addLayer({ id: "b-fill", type: "fill", source: "buildings", minzoom: DETAIL_ZOOM,
    paint: { "fill-color": colorExpr, "fill-opacity": ["case", ["==", ["get", "qhit"], 0], 0.15, 0.85] } });
  map.addLayer({ id: "b-line", type: "line", source: "buildings", minzoom: DETAIL_ZOOM,
    paint: { "line-color": "#00000055", "line-width": 0.6 } });
  map.addLayer({ id: "b-selected", type: "line", source: "buildings", minzoom: DETAIL_ZOOM, filter: ["==", ["get", "id"], -1],
    paint: { "line-color": "#1d4ed8", "line-width": 3 } });
  const hitOpacity = ["case", ["==", ["get", "qhit"], 0], 0.25, 1];
  map.addLayer({ id: "p-dots", type: "circle", source: "points", minzoom: 14, filter: ["!", ["get", "block"]],
    paint: { "circle-color": "#e34948", "circle-radius": 5, "circle-stroke-color": "#fff", "circle-stroke-width": 1.5, "circle-opacity": hitOpacity, "circle-stroke-opacity": hitOpacity } });
  map.addLayer({ id: "p-blocks", type: "circle", source: "points", minzoom: DETAIL_ZOOM, filter: ["get", "block"],
    paint: { "circle-color": "#fff", "circle-radius": 7, "circle-stroke-color": "#4a3aa7", "circle-stroke-width": 2.5, "circle-opacity": hitOpacity, "circle-stroke-opacity": hitOpacity } });
  const gridLayers = META.grid_m.map(m => `grid-${m}`);
  const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: "grid-tip", offset: 8 });
  for (const l of gridLayers) {
    map.on("mousemove", l, e => {
      const p = e.features[0].properties;
      tip.setLngLat(e.lngLat).setHTML(`<b>${money(p.ppsqm)} למ"ר</b><br>${fmt.format(p.n)} דירות מ-${META.color_from} · ריבוע ${p.m >= 1000 ? p.m / 1000 + ' ק"מ' : p.m + " מ'"}`).addTo(map);
    });
    map.on("mouseleave", l, () => tip.remove());
  }
  for (const l of [...gridLayers, "b-fill", "p-dots", "p-blocks"]) {
    map.on("mouseenter", l, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l, () => map.getCanvas().style.cursor = "");
  }
  onMove();
});

// ---------- grid cells
function cellsInView(kind) {
  const b = map.getBounds(), c = META.cell, keys = store[kind].keys, out = [];
  for (let x = Math.floor(b.getWest() / c); x <= Math.floor(b.getEast() / c); x++)
    for (let y = Math.floor(b.getSouth() / c); y <= Math.floor(b.getNorth() / c); y++)
      if (keys.has(`${x}_${y}`)) out.push(`${x}_${y}`);
  return out;
}

async function fetchCells(kind, keys) {
  const { data, pending } = store[kind], now = Date.now();
  keys.forEach(key => data.has(key) && (data.get(key).used = now));
  await Promise.all(keys.filter(key => !data.has(key)).map(key => {
    if (!pending.has(key)) pending.set(key, fetch(`data/${kind}/${key}.json`).then(r => r.json())
      .then(d => { data.set(key, { d, used: Date.now() }); pending.delete(key); }));
    return pending.get(key);
  }));
  if (data.size > MAX_CELLS) {
    const keep = new Set(keys);
    [...data.entries()].filter(([key]) => !keep.has(key)).sort((a, b) => a[1].used - b[1].used)
      .slice(0, data.size - MAX_CELLS).forEach(([key]) => data.delete(key));
  }
}

// The map sources hold only the cells in view: every setData re-tiles everything it is given.
async function showCells() {
  const keys = cellsInView("cells");
  await fetchCells("cells", keys);
  const key = keys.join(",");
  if (key === shownKey || keys.join(",") !== cellsInView("cells").join(",")) return;   // unchanged, or view moved on
  shownKey = key;
  const shown = keys.map(k => store.cells.data.get(k).d);
  const mark = features => {
    if (!streetNeedle || !window.NadlanQuery) return features;
    return features.map(f => {
      let list = f.properties.addresses || [];
      if (typeof list === "string") { try { list = JSON.parse(list); } catch { list = []; } }
      const hit = Array.isArray(list) && list.some(a => window.NadlanQuery.addressOnStreet(a, streetNeedle));
      return { ...f, properties: { ...f.properties, qhit: hit ? 1 : 0 } };
    });
  };
  map.getSource("buildings").setData({ type: "FeatureCollection", features: mark(shown.flatMap(c => c.b.features)) });
  map.getSource("points").setData({ type: "FeatureCollection", features: mark(shown.flatMap(c => c.p.features)) });
}

let moveTimer;
function onMove() {
  const zoomedIn = map.getZoom() >= DETAIL_ZOOM;
  document.getElementById("lg-zoomed-out").style.display = zoomedIn ? "none" : "";
  document.querySelectorAll(".lg-zoomed-in").forEach(e => e.style.display = zoomedIn ? "" : "none");
  clearTimeout(moveTimer);
  moveTimer = setTimeout(async () => {
    const jobs = [];
    if (map.getZoom() >= DETAIL_ZOOM) jobs.push(showCells());
    if (statsOpen()) jobs.push(updateStats());
    await Promise.all(jobs);
    if (viewHook && activeQuery) viewHook();
  }, 250);
}
async function updateStats() {
  if (map.getZoom() >= DETAIL_ZOOM) { renderStats(true); await fetchCells("stats", cellsInView("stats")); }
  renderStats();
}
map.on("moveend", () => META && onMove());

map.on("click", e => {
  const hit = map.queryRenderedFeatures(e.point, { layers: ["p-blocks", "p-dots", "b-fill", ...META.grid_m.map(m => `grid-${m}`)].filter(l => map.getLayer(l)) })[0];
  if (!hit) return;
  if (hit.layer.id.startsWith("grid-")) map.flyTo({ center: e.lngLat, zoom: Math.min(DETAIL_ZOOM + 1, map.getZoom() + 2) });
  else select(hit);
});

// ---------- side panel and tabs
const $ = id => document.getElementById(id);
const els = Object.fromEntries(["side", "title", "chips", "note", "deals", "toggle-block", "close", "tab-detail", "tab-stats", "detail", "stats"].map(i => [i, $(i)]));
const statsOpen = () => els.side.classList.contains("open") && els["tab-stats"].getAttribute("aria-selected") === "true";

function showTab(name) {
  els.side.classList.add("open");
  document.body.classList.add("has-panel");
  for (const t of ["detail", "stats"]) {
    els[`tab-${t}`].setAttribute("aria-selected", t === name);
    els[t].classList.toggle("active", t === name);
  }
  if (name === "stats") updateStats();
}
function closePanel() {
  els.side.classList.remove("open"); document.body.classList.remove("has-panel");
  map.getLayer("b-selected") && map.setFilter("b-selected", ["==", ["get", "id"], -1]);
}
els.close.addEventListener("click", closePanel);
els["tab-detail"].addEventListener("click", () => showTab("detail"));
els["tab-stats"].addEventListener("click", () => showTab("stats"));
$("open-stats").addEventListener("click", () => showTab("stats"));

// ---------- details tab
const blockCache = new Map();
let current = null, blockMode = false;

const loadBlock = gush => {
  if (!blockCache.has(gush)) blockCache.set(gush, fetch(`data/deals/${gush}.json`).then(r => r.ok ? r.json() : []));
  return blockCache.get(gush);
};

async function select(feature) {
  const p = feature.properties;
  const parse = v => typeof v === "string" ? JSON.parse(v) : (v || []);
  const parcels = parse(p.parcels), addresses = parse(p.addresses);
  const isBuilding = feature.layer.id === "b-fill";
  const isBlock = p.block === true || p.block === "true";
  map.setFilter("b-selected", ["==", ["get", "id"], isBuilding ? p.id : -1]);
  current = { parcels, addresses, isBuilding, isBlock, exact: p.exact === true || p.exact === "true" };
  blockMode = false;
  els["toggle-block"].hidden = false;
  els["tab-detail"].disabled = false;
  showTab("detail");
  els.title.textContent = isBlock ? `גוש ${parcels[0].split("/")[0]}`
    : addresses.length ? addresses.slice(0, 3).join(" · ") : "ללא כתובת רשומה";
  els.deals.innerHTML = '<div class="empty">טוען…</div>';
  await renderDetail();
}

async function renderDetail() {

  const enrich = d => { const unit = d.p ? d.paid / d.p : null; return { ...d, unit, ppsqm: unit && d.a ? unit / d.a : null }; };
  const rowsAll = shown.map(enrich).sort((a, b) => b.d.localeCompare(a.d));

    : "העסקאות משויכות לפי גוש וחלקה. אם בחלקה כמה בניינים, מוצגות עסקאות כולם."
      + (isBuilding && !exact ? " נקודת החלקה נמצאת ליד הבניין ולא בתוכו." : ""));
  els["toggle-block"].textContent = blockMode ? "חזרה" : "הצג את כל הגוש";

  const LIMIT = 300;
  const body = rows.slice(0, LIMIT).map(d => {
    const tags = [d.p && d.p < 1 ? `שולם ${money(d.paid)} עבור ${Math.round(d.p * 100)}%` : "", d.s ? "נתון חשוד" : ""].filter(Boolean);
    return `<tr class="${d.s ? "suspect" : ""}">
      <td class="num">${d.d.split("-").reverse().join("/")}</td>
      ${showChelka ? `<td class="num">${d.c}</td>` : ""}
      <td>${esc(d.t)}</td>
      <td class="num">${d.r ?? "—"}</td>
      <td class="num">${d.a ?? "—"}</td>
      <td class="num">${money(d.unit ?? d.paid)}${tags.length ? `<div class="tag">${tags.join(" · ")}</div>` : ""}</td>
      <td class="num">${money(d.ppsqm)}</td></tr>`;

  els.deals.innerHTML = rows.length
    ? `<table><thead><tr><th>תאריך</th>${showChelka ? "<th>חלקה</th>" : ""}<th>סוג</th><th>חדרים</th><th>מ"ר</th><th>מחיר</th><th>למ"ר</th></tr></thead><tbody>${body}</tbody></table>`
      + (rows.length > LIMIT ? `<div class="more">מוצגות ${LIMIT} העסקאות האחרונות מתוך ${fmt.format(rows.length)}</div>` : "")
    : '<div class="empty">לא נמצאו עסקאות שעונות על הסינון.</div>';

els["toggle-block"].addEventListener("click", async () => { blockMode = !blockMode; await renderDetail(); });

// ---------- stats tab
function countOk(year, typeIdx) {
  if (!activeQuery || !window.NadlanQuery) return true;
  return window.NadlanQuery.countPasses(year, typeIdx, activeQuery, META.types, META.apt_types);
}
function flatOk(flat) {
  if (!activeQuery || !window.NadlanQuery) return true;
  return window.NadlanQuery.flatPasses(flat, activeQuery, { rooms: roomsObserved() });
}
function roomsObserved() {
  for (const cell of store.stats.data.values()) {
    for (const loc of cell.d || []) {
      const flats = loc[3];
      if (flats && flats.length) return flats[0].length >= 4;
    }
  }
  return false;
}
function searchContext() {
  return { zoomedIn: map.getZoom() >= DETAIL_ZOOM, roomsInAreaStats: map.getZoom() >= DETAIL_ZOOM && roomsObserved() };
}
// Zoomed in: exact, from the per-point deal summaries of the loaded cells inside the view.
// Zoomed out: from the settlements whose point is in view; medians come from summed histograms (to within ~4%).
function aggregate() {
  const b = map.getBounds();
  const inView = (lon, lat) => b.contains([lon, lat]);
  const agg = { byYear: new Map(), byType: new Map(), total: 0, flatPpsqm: new Map(), flatPrice: new Map(), settlements: null };
  const addCount = (y, t, n) => {
    agg.total += n;
    agg.byYear.set(y, (agg.byYear.get(y) || 0) + n);
    agg.byType.set(t, (agg.byType.get(t) || 0) + n);
  };
  if (map.getZoom() >= DETAIL_ZOOM) {
    agg.mode = "exact";
    for (const key of cellsInView("stats")) {
      const c = store.stats.data.get(key);
      if (!c) { agg.loading = true; continue; }
      for (const [lon, lat, counts, flats] of c.d) {
        if (!inView(lon, lat)) continue;
        for (const [y, t, n] of counts) if (countOk(y, t)) addCount(y, t, n);
        for (const flat of flats) {
          if (!flatOk(flat)) continue;
          const price = flat[1] * 1000;
          const y = flat[0];
          if (!agg.flatPpsqm.has(y)) { agg.flatPpsqm.set(y, []); agg.flatPrice.set(y, []); }
          agg.flatPpsqm.get(y).push(price / flat[2]);
          agg.flatPrice.get(y).push(price);
        }
      }
    }
  } else {
    agg.mode = "hist";
    agg.settlements = SETTLEMENTS.filter(s => inView(s.lon, s.lat));
    for (const s of agg.settlements) {
      for (const [y, t, n] of s.counts) if (countOk(y, t)) addCount(y, t, n);
      for (const [key, target] of [["ph", agg.flatPpsqm], ["uh", agg.flatPrice]]) {
        const edges = key === "ph" ? META.ppsqm_edges : META.price_edges;
        const min = !activeQuery ? null : key === "ph" ? activeQuery.ppsqm_min : activeQuery.price_min;
        const max = !activeQuery ? null : key === "ph" ? activeQuery.ppsqm_max : activeQuery.price_max;
        for (const [y, bins] of Object.entries(s[key] || {})) {
          if (activeQuery && window.NadlanQuery && !window.NadlanQuery.yearOk(+y, activeQuery)) continue;
          const h = target.get(+y) || new Map();
          for (const [bin, n] of bins) {
            if (activeQuery && window.NadlanQuery && !window.NadlanQuery.histBinOk(bin, edges, min, max)) continue;
            h.set(bin, (h.get(bin) || 0) + n);
          }
          if (h.size) target.set(+y, h);
        }
      }
    }
  }
  return agg;
}

// median of either a plain array (exact) or a Map(bin -> count) over log-spaced edges (interpolated in log space)
function med(v, edges) {
  if (!v) return null;
  if (Array.isArray(v)) return v.length ? median(v) : null;
  const total = [...v.values()].reduce((a, b) => a + b, 0);
  if (!total) return null;
  let acc = 0;
  for (const bin of [...v.keys()].sort((a, b) => a - b)) {
    const n = v.get(bin);
    if (acc + n >= total / 2) {
      const f = (total / 2 - acc) / n, lo = Math.log(edges[bin]), hi = Math.log(edges[bin + 1]);
      return Math.exp(lo + f * (hi - lo));
    }
    acc += n;
  }
  return null;
}
const size = v => !v ? 0 : Array.isArray(v) ? v.length : [...v.values()].reduce((a, b) => a + b, 0);
function merge(groups) {           // several years' values into one
  const list = groups.filter(Boolean);
  if (!list.length) return null;
  if (Array.isArray(list[0])) return list.flat();
  const m = new Map();
  for (const h of list) for (const [bin, n] of h) m.set(bin, (m.get(bin) || 0) + n);
  return m;
}

function renderStats(loadingOnly) {
  if (!META) return;
  const agg = aggregate();
  if (loadingOnly && !agg.loading) return;
  const years = [...agg.byYear.keys()].sort();
  const lastYear = Math.max(...years, 0);
  const yearFiltered = activeQuery && (activeQuery.year_min != null || activeQuery.year_max != null);
  const recentYears = years.filter(y => yearFiltered ? true : y >= META.recent_from);
  const recentPp = merge(recentYears.map(y => agg.flatPpsqm.get(y)));
  const recentPr = merge(recentYears.map(y => agg.flatPrice.get(y)));
  const nRecent = size(recentPp);
  const pe = META.ppsqm_edges, ue = META.price_edges;

  const filterLine = activeQuery && window.NadlanQuery ? window.NadlanQuery.statsLine(activeQuery, searchContext()) : "";
  const scope = (agg.mode === "exact"
    ? `כל העסקאות שממוקמות באזור המוצג${agg.loading ? " (טוען…)" : ""}.`
    : `${fmt.format(agg.settlements.length)} יישובים שמרכזם באזור המוצג. התקרבו לרמת רחוב לנתונים מדויקים לאזור.`)
    + (filterLine ? " " + filterLine : "");
  if (!agg.total) { els.stats.innerHTML = `<p class="scope">${scope}</p><div class="empty">אין עסקאות באזור המוצג.</div>`; return; }

  const tile = (label, value, sub) => `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const caveat = [];
  if (activeQuery && (activeQuery.rooms_min != null || activeQuery.rooms_max != null)) caveat.push("חדרים");
  if (activeQuery && [activeQuery.price_min, activeQuery.price_max, activeQuery.ppsqm_min, activeQuery.ppsqm_max, activeQuery.area_min, activeQuery.area_max].some(v => v != null)) caveat.push("מחיר ושטח");
  const countSub = [`${years[0]}–${lastYear}`, caveat.length ? `בלי סינון ${caveat.join(" ו")}` : ""].filter(Boolean).join(" · ");
  const focusFrom = recentYears[0] ?? (yearFiltered ? activeQuery.year_min : META.recent_from);
  const focusTo = recentYears[recentYears.length - 1] ?? lastYear;
  const recentLbl = yearFiltered ? `דירות, ${focusFrom}–${focusTo}` : `דירות, ${META.recent_from}–${lastYear}`;
  let html = `<p class="scope">${scope}</p><div class="tiles">
    ${tile("עסקאות (כל הסוגים, כל השנים)", compact.format(agg.total), countSub)}
    ${tile("עסקאות דירות", compact.format(nRecent), recentLbl)}
    ${tile('מחיר חציוני למ"ר', nRecent >= 5 ? moneyC(med(recentPp, pe)) : "—", recentLbl)}
    ${tile("מחיר חציוני לדירה", nRecent >= 5 ? moneyC(med(recentPr, ue)) : "—", recentLbl)}
  </div>`;

  const allYears = []; for (let y = years[0]; y <= lastYear; y++) allYears.push(y);
  html += `<h3>עסקאות לפי שנה</h3><p class="cap">כל סוגי העסקאות${lastYear >= new Date().getFullYear() ? `. ${lastYear} חלקית` : ""}</p>`
    + barChart(allYears.map(y => ({ x: y, v: agg.byYear.get(y) || 0 })), lastYear);
  const ppSeries = allYears.map(y => { const v = agg.flatPpsqm.get(y); return { x: y, v: size(v) >= 5 ? med(v, pe) : null, n: size(v) }; });
  html += `<h3>מחיר חציוני למ"ר, דירות</h3><p class="cap">מחירים נומינליים. שנים עם פחות מ-5 עסקאות מושמטות</p>` + lineChart(ppSeries);

  const types = [...agg.byType.entries()].sort((a, b) => b[1] - a[1]);
  const top = types.slice(0, 6), rest = types.slice(6).reduce((a, [, n]) => a + n, 0);
  const rows = top.map(([t, n]) => [META.types[t], n]).concat(rest ? [["אחר", rest]] : []);
  const maxN = Math.max(...rows.map(r => r[1]));
  html += `<h3>סוגי עסקאות</h3><p class="cap">כל השנים</p>` + rows.map(([name, n]) =>
    `<div class="hbar"><span class="name" title="${esc(name)}">${esc(name)}</span><span class="track"><div class="fill" style="width:${100 * n / maxN}%"></div></span><span class="val">${fmt.format(n)}</span></div>`).join("");

  if (agg.settlements && agg.settlements.length > 1) {
    const list = [...agg.settlements].sort((a, b) => b.n - a.n).slice(0, 15);
    html += `<h3>יישובים באזור</h3><p class="cap">15 היישובים עם הכי הרבה עסקאות. מחיר למ"ר: דירות מ-${META.color_from}</p>
      <table><thead><tr><th>יישוב</th><th>עסקאות</th><th>למ"ר</th></tr></thead><tbody>${list.map(s =>
      `<tr><td>${esc(s.name)}</td><td class="num">${fmt.format(s.n)}</td><td class="num">${money(s.ppsqm)}</td></tr>`).join("")}</tbody></table>`;
  }
  els.stats.innerHTML = html;
  bindTips();
}

// small SVG charts: one series each, recessive axes, hover tooltip per year
const W = 440, H = 150, PAD = { l: 44, r: 8, t: 8, b: 20 };
function axes(xs, maxV, fmtY) {
  const ticks = [0, maxV / 2, maxV];
  const y = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / maxV);
  const step = Math.ceil(xs.length / 7);
  return ticks.map(t => `<line class="grid" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${PAD.l - 6}" y="${y(t) + 3}" text-anchor="end">${fmtY(t)}</text>`).join("")
    + xs.map((x, i) => (i % step === 0 || i === xs.length - 1) && (i === xs.length - 1 || xs.length - 1 - i >= step / 2)
      ? `<text x="${xScale(xs.length)(i)}" y="${H - 5}" text-anchor="middle">${x}</text>` : "").join("");
}
const xScale = n => i => PAD.l + (W - PAD.l - PAD.r) * (i + 0.5) / n;
function barChart(points, partialYear) {
  const max = niceMax(Math.max(...points.map(p => p.v), 1)), n = points.length, x = xScale(n);
  const bw = Math.max(2, (W - PAD.l - PAD.r) / n - 2), y = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / max), base = H - PAD.b;
  const bars = points.map((p, i) => {
    const h = base - y(p.v), r = Math.min(4, bw / 2, h);
    const tip = `${p.x}${p.x === partialYear && partialYear >= new Date().getFullYear() ? " (חלקית)" : ""}: ${fmt.format(p.v)} עסקאות`;
    return (p.v ? `<path d="M${x(i) - bw / 2},${base}V${y(p.v) + r}q0,-${r} ${r},-${r}h${bw - 2 * r}q${r},0 ${r},${r}V${base}Z" fill="var(--bar)" opacity="${p.x === partialYear && partialYear >= new Date().getFullYear() ? 0.45 : 1}"/>` : "")
      + `<rect x="${x(i) - (W - PAD.l - PAD.r) / n / 2}" y="${PAD.t}" width="${(W - PAD.l - PAD.r) / n}" height="${base - PAD.t}" fill="transparent" data-tip="${esc(tip)}"/>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${axes(points.map(p => p.x), max, compact.format)}${bars}</svg><div class="tip"></div></div>`;
}
function lineChart(points) {
  const vals = points.filter(p => p.v != null);
  if (!vals.length) return '<p class="cap">אין מספיק עסקאות דירות באזור.</p>';
  const max = niceMax(Math.max(...vals.map(p => p.v))), n = points.length, x = xScale(n);
  const y = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / max);
  let d = "", prev = false;
  points.forEach((p, i) => { if (p.v == null) { prev = false; return; } d += `${prev ? "L" : "M"}${x(i)},${y(p.v)}`; prev = true; });
  const dots = points.map((p, i) => p.v == null ? "" : `<circle cx="${x(i)}" cy="${y(p.v)}" r="2.5" fill="var(--bar)"/>`).join("");
  const hits = points.map((p, i) => `<rect x="${x(i) - (W - PAD.l - PAD.r) / n / 2}" y="${PAD.t}" width="${(W - PAD.l - PAD.r) / n}" height="${H - PAD.b - PAD.t}" fill="transparent" data-tip="${esc(p.v == null ? `${p.x}: פחות מ-5 עסקאות` : `${p.x}: ${money(p.v)} למ"ר (${fmt.format(p.n)} עסקאות)`)}"/>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${axes(points.map(p => p.x), max, v => "₪" + compact.format(v))}<path d="${d}" fill="none" stroke="var(--bar)" stroke-width="2"/>${dots}${hits}</svg><div class="tip"></div></div>`;
}
function niceMax(v) { const m = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map(s => s * m).find(s => s >= v); }
function applySearchQuery(query, extra = {}) {
  activeQuery = query;
  streetNeedle = extra.street || "";
  shownKey = "";
  if (!query) {
    if (map.getZoom() >= DETAIL_ZOOM) showCells();
    if (statsOpen()) updateStats();
    if (current) renderDetail();
    return;
  }
  if (map.getZoom() >= DETAIL_ZOOM) showCells();
  if (current) renderDetail();
  showTab("stats");
}

// Example deals for the search box: flats passing the active filters, newest first, taken from the stats
// cells around a centre (a settlement's centre, or the matched street). Addresses come from the cell's points.
async function findExamples(lon, lat, radius, limit = 25) {
  const q = activeQuery;
  if (!q || !window.NadlanQuery) return [];
  const c = META.cell, keyOf = (x, y) => `${Math.floor(x / c)}_${Math.floor(y / c)}`;
  const keys = [];
  for (let x = Math.floor((lon - radius) / c); x <= Math.floor((lon + radius) / c); x++)
    for (let y = Math.floor((lat - radius) / c); y <= Math.floor((lat + radius) / c); y++)
      if (store.stats.keys.has(`${x}_${y}`)) keys.push(`${x}_${y}`);
  await fetchCells("stats", keys);
  const caps = { rooms: true };
  const cand = [];
  for (const key of keys) {
    for (const [plon, plat, , flats] of store.stats.data.get(key)?.d || []) {
      if (Math.abs(plon - lon) > radius || Math.abs(plat - lat) > radius) continue;
      let best = null;
      for (const flat of flats) {
        if (flat.length < 4 && (q.rooms_min != null || q.rooms_max != null)) continue;
        if (!window.NadlanQuery.flatPasses(flat, q, caps)) continue;
        if (!best || flat[0] > best[0]) best = flat;
      }
      if (best) cand.push({ lon: plon, lat: plat, flat: best });
    }
  }
  cand.sort((a, b) => b.flat[0] - a.flat[0]);
  const cellKeys = [...new Set(cand.slice(0, streetNeedle ? 400 : limit * 3).map(x => keyOf(x.lon, x.lat)))];
  await fetchCells("cells", cellKeys.filter(k => store.cells.keys.has(k)));
  const propsAt = new Map();
  for (const k of cellKeys) for (const f of store.cells.data.get(k)?.d.p.features || []) {
    const [x, y] = f.geometry.coordinates;
    propsAt.set(`${x.toFixed(5)},${y.toFixed(5)}`, f.properties);
  }
  const blds = cellKeys.flatMap(k => store.cells.data.get(k)?.d.b.features || []).map(f => {
    const ring = f.geometry.coordinates[0], xs = ring.map(r => r[0]), ys = ring.map(r => r[1]);
    return { f, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  });
  const list = v => typeof v === "string" ? (() => { try { return JSON.parse(v); } catch { return []; } })() : (v || []);
  const out = [];
  for (const x of cand) {
    let props = propsAt.get(`${x.lon.toFixed(5)},${x.lat.toFixed(5)}`);
    if (!props) props = blds.find(b => x.lon >= b.x0 - 2e-5 && x.lon <= b.x1 + 2e-5 && x.lat >= b.y0 - 2e-5 && x.lat <= b.y1 + 2e-5)?.f.properties;
    const addrs = list(props?.addresses), parcels = list(props?.parcels);
    if (streetNeedle && !addrs.some(a => window.NadlanQuery.addressOnStreet(a, streetNeedle))) continue;
    if (!parcels.length) continue;
    const onStreet = streetNeedle ? addrs.find(a => window.NadlanQuery.addressOnStreet(a, streetNeedle)) : null;
    out.push({ lon: x.lon, lat: x.lat, address: onStreet || addrs[0] || "", parcels });
    if (out.length >= limit) break;
  }
  return out;
}

// Search results in the deals tab: the newest deals that pass the active filters, from the example buildings.
async function showResults(places, title) {
  if (!activeQuery || !places) return;
  current = null;
  els["tab-detail"].disabled = false;
  showTab("detail");
  els["toggle-block"].hidden = true;
  els.title.textContent = title || "תוצאות החיפוש";
  els.deals.innerHTML = '<div class="empty">טוען…</div>';
  const rows = [];
  for (const pl of places) {
    const before = rows.length;
    const gushes = [...new Set(pl.parcels.map(s => s.split("/")[0]))];
    const mine = new Set(pl.parcels);
    for (const g of gushes) {
      for (const d of await loadBlock(g)) {
        if (!mine.has(`${g}/${d.c}`)) continue;
        const unit = d.p ? d.paid / d.p : null;
        const e = { ...d, gush: g, unit, ppsqm: unit && d.a ? unit / d.a : null, address: pl.address, lon: pl.lon, lat: pl.lat };
        if (!e.s && window.NadlanQuery.dealPasses(e, activeQuery, META.apt_types)) rows.push(e);
      }
    }
    // newest three per building, so a few busy buildings do not fill the list
    rows.splice(before, rows.length - before, ...rows.slice(before).sort((a, b) => b.d.localeCompare(a.d)).slice(0, 3));
  }
  rows.sort((a, b) => b.d.localeCompare(a.d));
  const seen = new Set(), uniq = rows.filter(d => { const k = `${d.gush}/${d.c}/${d.d}/${d.paid}/${d.a}`; return !seen.has(k) && seen.add(k); });
  const shown = uniq.slice(0, 60);
  els.chips.innerHTML = `<span class="chip">${fmt.format(shown.length)} עסקאות אחרונות שעונות על החיפוש</span>`;
  els.note.textContent = "דוגמאות מהבניינים באזור. הקליקו על שורה כדי לעבור לבניין.";
  els.deals.innerHTML = shown.length
    ? `<table><thead><tr><th>תאריך</th><th>כתובת</th><th>חדרים</th><th>מ"ר</th><th>מחיר</th><th>למ"ר</th></tr></thead><tbody>${shown.map((d, i) =>
      `<tr class="pick" data-i="${i}"><td class="num">${d.d.split("-").reverse().join("/")}</td><td>${esc(d.address || "—")}</td><td class="num">${d.r ?? "—"}</td><td class="num">${d.a ?? "—"}</td><td class="num">${money(d.unit ?? d.paid)}</td><td class="num">${money(d.ppsqm)}</td></tr>`).join("")}</tbody></table>`
    : '<div class="empty">לא נמצאו עסקאות שעונות על הסינון באזור.</div>';
  els.deals.querySelectorAll(".pick").forEach(tr => tr.addEventListener("click", () => {
    const d = shown[Number(tr.dataset.i)];
    map.flyTo({ center: [d.lon, d.lat], zoom: 18, essential: true });
  }));
  return shown.length;
}

let streetIndexPromise = null;
const streetFiles = new Map();
async function loadStreets(name) {
  if (!META?.street_index || !name) return { status: "missing", streets: [] };
  if (!streetIndexPromise) {
    streetIndexPromise = fetch("data/" + META.street_index).then(r => r.ok ? r.json() : null).catch(() => null);
  }
  const idx = await streetIndexPromise;
  if (!idx) return { status: "missing", streets: [] };
  const rel = idx[name];
  if (!rel) return { status: "ready", streets: [] };
  if (!streetFiles.has(name)) {
    streetFiles.set(name, fetch("data/" + rel).then(r => r.ok ? r.json() : []).catch(() => []));
  }
  return { status: "ready", streets: await streetFiles.get(name) };
}

window.NadlanMap = {
  whenReady: () => readyPromise,
  getSettlements: () => SETTLEMENTS,
  getMeta: () => META,
  flyTo: (lon, lat, zoom) => map.flyTo({ center: [lon, lat], zoom, essential: true }),
  setQuery: (query, extra) => applySearchQuery(query, extra),
  clearQuery: () => applySearchQuery(null),
  loadStreets,
  findExamples,
  getCenter: () => { const c = map.getCenter(); return { lon: c.lng, lat: c.lat }; },
  showResults,
  roomsInAreaStats: () => map.getZoom() >= DETAIL_ZOOM && roomsObserved(),
  zoomedIn: () => map.getZoom() >= DETAIL_ZOOM,
  onView: fn => { viewHook = fn; },
};

function bindTips() {
  els.stats.querySelectorAll(".chart").forEach(ch => {
    const tip = ch.querySelector(".tip");
    ch.querySelectorAll("[data-tip]").forEach(r => {
      r.addEventListener("mouseenter", () => {
        const box = r.getBoundingClientRect(), host = ch.getBoundingClientRect();
        tip.textContent = r.dataset.tip; tip.style.display = "block";
        tip.style.left = `${box.left - host.left + box.width / 2}px`; tip.style.top = `${box.top - host.top + 12}px`;
        r.setAttribute("fill", "rgba(0,0,0,.05)");
      });
      r.addEventListener("mouseleave", () => { tip.style.display = "none"; r.setAttribute("fill", "transparent"); });
    });
  });
}
