name = "nadlan-search"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Free path: Gemini API free tier. Set the key with:
#   npx wrangler secret put GEMINI_API_KEY
# Optional model override (default gemini-3.8-flash, which has a free tier):
# [vars]
# GEMINI_MODEL = "gemini-3.8-flash"

# Workers AI is optional and is not on every free account. Uncomment to use it
# instead of (or before) Gemini. The script prefers Workers AI when this
# binding exists, and Gemini when GEMINI_API_KEY is set.
# [ai]
# binding = "AI"

# [vars]
# WORKERS_AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
